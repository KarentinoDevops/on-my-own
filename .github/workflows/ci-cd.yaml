name: Build and push docker image then deploy with ECS

on: push
  
jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - name: checkout
      uses: actions/checkout@v4

    - name: Use Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: 'npm'
        
    - run: npm ci
    - run: npm run build --if-present
    - run: npm test
    - run: npx eslint . --fix

  docker:
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4

    - name: Login Dockerhub
      uses: docker/login-action@v4
      with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v4 
      
    - name: Set up Docker buildx
      uses: docker/setup-buildx-action@v4 
      
    - name: Build and push
      uses: docker/build-push-action@v7
      with:
          context: .
          push: true
          tags: karentinodevops/on-my-own:${{ github.sha }}
    
  deploy:
    needs: docker
    runs-on: ubuntu-latest

    env:
      AWS_REGION: eu-west-2
      ECS_SERVICE: on-my-own-task-def-service-138ygk9i
      ECS_CLUSTER: on-my-own-cluster
      ECS_TASK_DEFINITION: ecs-task-def.json
      CONTAINER_NAME: on-my-own-container

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.CONTAINER_NAME }}
          image: karentinodevops/on-my-own:${{ github.sha }}

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true
        
    
